[package]
name = "podor-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "podor_engine"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1.3"
flate2 = "1"
png = "0.17"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "webp", "tiff", "bmp"] }
tiff = "0.11.3"
zip = { version = "8.6.0", default-features = false }

[target.'cfg(not(target_os = "ios"))'.dependencies]
jni = "0.21"

[[bench]]
name = "painting"
harness = false

[[bench]]
name = "editing"
harness = false

[[bench]]
name = "previews"
harness = false

[[bench]]
name = "blending"
harness = false

[[bench]]
name = "imports"
harness = false

[[bench]]
name = "exports"
harness = false

[[bench]]
name = "layers"
harness = false
